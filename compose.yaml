services:
  archive:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    image: people-gator-archive:local
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "8787"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.peoplegator-dataset.rule=Host(`${SUBDOMAIN:-peoplegator-dataset}.${BASE_DOMAIN:-capturemyhand.com}`)"
      - "traefik.http.routers.peoplegator-dataset.entrypoints=websecure"
      - "traefik.http.routers.peoplegator-dataset.tls=true"
      - "traefik.http.routers.peoplegator-dataset.tls.certresolver=tlschallenge"
      - "traefik.http.services.peoplegator-dataset.loadbalancer.server.port=8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATASET_DIR: /data
      FEEDBACK_FILE: /feedback/people_gator__feedback.jsonl
    volumes:
      - type: bind
        source: ${DATASET_PATH:-./dataset}
        target: /data
        read_only: true
      - type: bind
        source: ${FEEDBACK_PATH:-./feedback}
        target: /feedback
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - web

networks:
  web:
    external: true
    name: web
